# DominoClub — nginx reverse proxy
# Milestone 5: Production deployment configuration
#
# Place SSL certificates at:
#   /etc/ssl/certs/dominoclub.crt
#   /etc/ssl/private/dominoclub.key
#
# Replace YOUR_DOMAIN with your actual domain in every occurrence below.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN;
        return 301 https://$host$request_uri;
    }

    # ── API / WebSocket backend (api.YOUR_DOMAIN) ────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.YOUR_DOMAIN;

        ssl_certificate     /etc/ssl/certs/dominoclub.crt;
        ssl_certificate_key /etc/ssl/private/dominoclub.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header X-Frame-Options           DENY;
        add_header X-Content-Type-Options    nosniff;
        add_header X-XSS-Protection          "1; mode=block";
        add_header Referrer-Policy           strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Auth endpoints — strict rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://127.0.0.1:3001;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # General API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://127.0.0.1:3001;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # WebSocket (Socket.io)
        location /socket.io/ {
            proxy_pass             http://127.0.0.1:3001;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_set_header       X-Real-IP  $remote_addr;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # Health check (no rate limit)
        location /health {
            proxy_pass http://127.0.0.1:3001;
        }
    }

    # ── Admin dashboard (admin.YOUR_DOMAIN) ──────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.YOUR_DOMAIN;

        ssl_certificate     /etc/ssl/certs/dominoclub.crt;
        ssl_certificate_key /etc/ssl/private/dominoclub.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # IP allowlist — uncomment and replace with your office/VPN IP range
        # allow 203.0.113.0/24;
        # deny  all;

        add_header X-Frame-Options           SAMEORIGIN;
        add_header X-Content-Type-Options    nosniff;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass         http://127.0.0.1:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
